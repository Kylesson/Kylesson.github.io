<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building Damage Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a signage-style index of section names. Clicking one opens a full-screen gallery that grows out of the click point. */
:root{
  color-scheme:dark;
  --bg:#1a1918;
  --panel:#252321;
  --line:#37332f;
  --fg:#ece8e1;
  --dim:#9d978d;
  --accent:#d9c7a3;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Noto Sans TC',system-ui,-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  --gutter:clamp(16px,4vw,56px);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{max-width:1180px;margin:0 auto;padding:clamp(32px,7vw,88px) var(--gutter) 96px}
.page>header{margin-bottom:clamp(32px,6vw,72px)}
.page h1{font:600 clamp(48px,11vw,132px)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:0 0 16px;text-wrap:balance}
.page .lede{color:var(--dim);max-width:46ch;margin:0}

.group{margin-top:clamp(36px,6vw,64px)}
.glabel{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin:0 0 4px;font:500 13px/1.4 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.glabel span{color:var(--dim);letter-spacing:.04em;text-transform:none;white-space:nowrap}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px 32px;padding:20px 0;border-top:1px solid var(--line);text-decoration:none;position:relative}
.group .row:last-child{border-bottom:1px solid var(--line)}
.name{display:flex;flex-direction:column;gap:4px;min-width:0}
.en{font:600 clamp(30px,5.4vw,58px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;transition:color .25s,transform .35s cubic-bezier(.2,.7,.2,1);text-wrap:balance}
.zh{color:var(--dim);font-size:15px}
.meta{display:flex;align-items:center;gap:20px}
.count{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumbs{display:flex;gap:6px}
.thumbs img{width:64px;height:84px;object-fit:cover;border-radius:3px;background:var(--panel);opacity:.7;filter:grayscale(.35);transition:opacity .3s,filter .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
.arrow{font-size:26px;line-height:1;color:var(--dim);transition:transform .3s,color .25s}
.row:hover .en,.row:focus-visible .en{color:var(--accent);transform:translateX(8px)}
.row:hover .arrow,.row:focus-visible .arrow{color:var(--accent);transform:translateX(6px)}
.row:hover .thumbs img,.row:focus-visible .thumbs img{opacity:1;filter:none}
.row:hover .thumbs img:nth-child(2){transform:translateY(-4px)}
@media (max-width:700px){
  .row{grid-template-columns:minmax(0,1fr)}
  .meta{flex-direction:row-reverse;justify-content:flex-end;gap:12px}
  .meta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .thumbs{order:1}.thumbs img{flex:1 1 0;min-width:0;width:auto;height:72px}
  .count{order:2}.arrow{display:none}
}

/* Section view */
.view{position:fixed;inset:0;z-index:10;overflow:auto;background:var(--bg);overscroll-behavior:contain;outline:none}
.view[hidden]{display:none}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gutter);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-size:14px;white-space:nowrap;transition:border-color .2s,color .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.pager{display:flex;gap:8px}
.hero{padding:clamp(28px,6vw,64px) var(--gutter) 28px;max-width:1500px;margin:0 auto}
.hero .grp{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
.hero h2{font:600 clamp(48px,10vw,120px)/.92 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:0;text-wrap:balance}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);margin:14px 0 0}
.g{columns:4 230px;column-gap:10px;padding:0 var(--gutter) 72px;max-width:1500px;margin:0 auto}
.g a{display:block;break-inside:avoid;margin-bottom:10px;border-radius:6px;overflow:hidden;background:var(--panel);animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*40ms + 280ms)}
.g img{width:100%;display:block;min-height:90px;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.g a:hover img{transform:scale(1.04)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .g a{animation:none}
  .en,.arrow,.thumbs img,.g img{transition:none}
}
noscript p{padding:var(--gutter)}
</style>
</head>

const secs=[];G.forEach(g=>g.sections.forEach(s=>{s.group=g.title;secs.push(s)}));
const byId=Object.fromEntries(secs.map(s=>[s.id,s]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cdn=(m,w)=>'https://cdn.cosmos.so/'+m+'?format=webp&w='+w;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const view=document.getElementById('view');
const total=secs.reduce((n,s)=>n+s.items.length,0);
document.getElementById('lede').textContent=total+' reference photos from Cosmos in '+secs.length+' sections. Pick a section to step inside.';

document.getElementById('groups').innerHTML=G.map(g=>
  '<section class="group"><h2 class="glabel">'+esc(g.title)+'<span>'+g.sections.length+' sections</span></h2>'+
  g.sections.map(s=>
    '<a class="row" href="#'+s.id+'" data-id="'+s.id+'">'+
      '<span class="name"><span class="en">'+esc(s.en)+'</span><span class="zh" lang="zh-Hant">'+esc(s.zh)+'</span></span>'+
      '<span class="meta"><span class="thumbs">'+s.items.slice(0,3).map(i=>'<img loading="lazy" alt="" src="'+cdn(i[1],240)+'">').join('')+'</span>'+
      '<span class="count">'+s.items.length+' photos</span><span class="arrow" aria-hidden="true">→</span></span>'+
    '</a>').join('')+
  '</section>').join('');

const rows={};document.querySelectorAll('.row').forEach(r=>rows[r.dataset.id]=r);
let current=null,lastOrigin=null,pending=null;

function fill(s){
  const i=secs.indexOf(s),prev=secs[i-1],next=secs[i+1];
  view.setAttribute('aria-label',s.en);
  view.innerHTML=
    '<div class="bar"><a class="btn" href="#" data-back>← All sections</a><div class="pager">'+
      '<a class="btn" '+(prev?'href="#'+prev.id+'" data-go="'+prev.id+'" title="'+esc(prev.en)+'"':'aria-disabled="true"')+'>← Prev</a>'+
      '<a class="btn" '+(next?'href="#'+next.id+'" data-go="'+next.id+'" title="'+esc(next.en)+'"':'aria-disabled="true"')+'>Next →</a>'+
    '</div></div>'+
    '<div class="hero"><p class="grp">'+esc(s.group)+'</p><h2>'+esc(s.en)+'</h2>'+
      '<p class="sub"><span lang="zh-Hant">'+esc(s.zh)+'</span><span>'+s.items.length+' photos</span></p></div>'+
    '<div class="g">'+s.items.map((it,n)=>'<a style="--i:'+Math.min(n,14)+'" href="https://www.cosmos.so/e/'+it[0]+'" target="_blank" rel="noopener"><img loading="lazy" alt="" src="'+cdn(it[1],640)+'"></a>').join('')+'</div>';
  view.scrollTop=0;
  current=s;
}
function radius(o){return Math.hypot(Math.max(o.x,innerWidth-o.x),Math.max(o.y,innerHeight-o.y))}
function show(s,origin){
  const wasOpen=!view.hidden;
  fill(s);
  if(!wasOpen){
    view.hidden=false;
    document.documentElement.style.overflow='hidden';
    const o=origin||lastOrigin||{x:innerWidth/2,y:innerHeight/2};
    lastOrigin=o;
    if(!reduce)view.animate([{clipPath:'circle(0px at '+o.x+'px '+o.y+'px)'},{clipPath:'circle('+radius(o)+'px at '+o.x+'px '+o.y+'px)'}],{duration:650,easing:'cubic-bezier(.22,.7,.2,1)'});
    view.focus({preventScroll:true});
  }else if(!reduce){
    view.animate([{opacity:0},{opacity:1}],{duration:260});
  }
}
function hide(){
  if(view.hidden)return;
  const row=current&&rows[current.id];
  const finish=()=>{view.hidden=true;document.documentElement.style.overflow='';if(row)row.focus({preventScroll:true})};
  if(row)row.scrollIntoView({block:'center'});
  let o={x:innerWidth/2,y:innerHeight/2};
  if(row){const r=row.getBoundingClientRect();o={x:r.left+r.width/2,y:r.top+r.height/2}}
  if(reduce){finish();return}
  const a=view.animate([{clipPath:'circle('+radius(o)+'px at '+o.x+'px '+o.y+'px)'},{clipPath:'circle(0px at '+o.x+'px '+o.y+'px)'}],{duration:480,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
  a.onfinish=()=>{finish();a.cancel()};
}
function route(){
  const s=byId[decodeURIComponent(location.hash.slice(1))];
  if(s){show(s,pending);pending=null}else hide();
}
addEventListener('hashchange',route);

document.getElementById('groups').addEventListener('click',e=>{
  const row=e.target.closest('.row');
  if(!row||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  if(location.hash==='#'+row.dataset.id)return;
  e.preventDefault();
  let o={x:e.clientX,y:e.clientY};
  if(e.detail===0){const r=row.getBoundingClientRect();o={x:r.left+r.width/2,y:r.top+r.height/2}}
  pending=o;
  location.hash=row.dataset.id;
});
view.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(!go||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();
  history.replaceState(null,'','#'+go.dataset.go);
  show(byId[go.dataset.go]);
});
addEventListener('keydown',e=>{
  if(view.hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){location.hash=''}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const n=secs[secs.indexOf(current)+(e.key==='ArrowRight'?1:-1)];
    if(n){history.replaceState(null,'','#'+n.id);show(n)}
  }
});
route();
