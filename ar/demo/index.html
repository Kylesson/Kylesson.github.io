<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scan the poster</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0d; color: #f4efe6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #ar { position: fixed; inset: 0; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 32px; text-align: center; z-index: 10;
    background: radial-gradient(circle at 50% 35%, #2a2a2a, #0d0d0d 70%); }
  #start h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  #start p { margin: 0; max-width: 300px; line-height: 1.45; opacity: .8; font-size: 15px; }
  #start button { margin-top: 8px; padding: 14px 34px; border: 0; border-radius: 999px;
    background: #f4efe6; color: #111; font-size: 16px; font-weight: 700; cursor: pointer; }
  #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5;
    padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 14px;
    backdrop-filter: blur(6px); transition: opacity .4s; pointer-events: none; }
  #hint.hide { opacity: 0; }
  #err { color: #ff9b8a; font-size: 14px; max-width: 300px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="ar"></div>
<div id="start">
  <h1 id="title">Bring the poster to life</h1>
  <p>Tap start, allow the camera, then point your phone at the poster.</p>
  <button id="go">Start</button>
  <div id="err"></div>
</div>
<div id="hint" class="hide">Point at the poster</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

// Everything poster-specific lives in scene.json, so a new poster = new files, same page.
const cfg = await (await fetch("./scene.json")).json();
document.getElementById("title").textContent = cfg.title || "Bring the poster to life";

const hint = document.getElementById("hint");
const aspect = cfg.height / cfg.width;          // MindAR: target width = 1 unit

const mindar = new MindARThree({
  container: document.getElementById("ar"),
  imageTargetSrc: "./targets.mind",
  uiScanning: "no", uiLoading: "yes",
  filterMinCF: 0.0001, filterBeta: 0.001,     // steadier tracking, less jitter
});
const { renderer, scene, camera } = mindar;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const anchor = mindar.addAnchor(0);

const loader = new THREE.TextureLoader();
const layers = [];
for (const L of cfg.layers) {
  const tex = await loader.loadAsync(L.src);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const s = L.scale || 1;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(s, s * aspect * (L.aspectFix || 1)), mat);
  mesh.position.set(L.x || 0, L.y || 0, 0);
  mesh.renderOrder = layers.length;
  anchor.group.add(mesh);
  layers.push({ mesh, cfg: L, z: L.z || 0, baseX: L.x || 0, baseY: L.y || 0 });
}

// Floating sparkles in front of the poster (optional)
let sparks = null;
if (cfg.sparkles) {
  const n = cfg.sparkles.count || 40, pos = new Float32Array(n * 3), seed = [];
  for (let i = 0; i < n; i++) {
    pos[i*3] = (Math.random() - .5) * 0.9; pos[i*3+1] = (Math.random() - .5) * aspect * 0.9;
    pos[i*3+2] = Math.random() * 0.35; seed.push(Math.random() * 10);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: cfg.sparkles.color || "#ffd98a", size: 0.018,
    transparent: true, opacity: .85, depthWrite: false, blending: THREE.AdditiveBlending });
  sparks = new THREE.Points(g, m); sparks.userData.seed = seed; sparks.renderOrder = 99;
  anchor.group.add(sparks);
}

// Entrance: layers rise out of the paper when the poster is found
let found = 0, rise = 0;
anchor.onTargetFound = () => { window.__foundAt = performance.now(); found = performance.now(); hint.classList.add("hide"); };
anchor.onTargetLost  = () => { found = 0; rise = 0; hint.classList.remove("hide"); };
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);

function animate(t) {
  const sec = t / 1000;
  if (found) rise = ease((t - found) / 900);
  layers.forEach((L, i) => {
    const a = L.cfg.anim || {}, m = L.mesh;
    const delay = i * 0.12;                                // stagger
    const r = found ? ease(((t - found) / 900) - delay) : 0;
    let z = L.z * r, x = L.baseX, y = L.baseY, rotZ = 0, sc = 1;
    if (a.bob)   y += Math.sin(sec * (a.bobSpeed || 1.6)) * a.bob;
    if (a.sway)  rotZ = Math.sin(sec * (a.swaySpeed || 1.1)) * a.sway;
    if (a.pulse) sc = 1 + Math.sin(sec * (a.pulseSpeed || 2.2)) * a.pulse;
    if (a.pop)   sc *= 0.6 + 0.4 * r;
    m.position.set(x, y, z); m.rotation.z = rotZ; m.scale.setScalar(sc);
    m.material.opacity = a.fadeIn ? r : 1;
  });
  if (sparks) {
    const p = sparks.geometry.attributes.position, s = sparks.userData.seed;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) + 0.0012; if (y > aspect * 0.45) y = -aspect * 0.45;
      p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(sec * 1.5 + s[i]) * 0.0006);
    }
    p.needsUpdate = true; sparks.material.opacity = 0.85 * rise;
  }
  renderer.render(scene, camera);
}

document.getElementById("go").onclick = async () => {
  try {
    await mindar.start();
    document.getElementById("start").remove();
    hint.classList.remove("hide");
    renderer.setAnimationLoop(animate);
  } catch (e) {
    document.getElementById("err").textContent =
      "Camera didn't start. Open this page in Safari or Chrome (not inside Instagram) and allow camera access.";
    console.error(e);
  }
};
</script>
</body>
</html>
